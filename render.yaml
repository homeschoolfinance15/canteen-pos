services:
  - type: web
    name: canteen-pos
    runtime: docker
    plan: free
    region: oregon
    branch: main
    repo: https://github.com/homeschoolfinance15/canteen-pos
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: canteen-pos-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "1"
      - key: REPORT_TIME_ZONE
        value: America/New_York
      - key: INITIAL_MANAGER_EMAIL
        sync: false
      - key: INITIAL_MANAGER_PASSWORD
        sync: false
      - key: INITIAL_MANAGER_NAME
        value: Manager

databases:
  - name: canteen-pos-db
    databaseName: canteen_pos
    user: canteen_pos_user
    plan: free
    postgresMajorVersion: "15"
    ipAllowList: []
